name: "Build Mod"

on:
  push:
    branches:
      - main
    paths:
      - "mapsync-mod/**/*"
  pull_request:
    branches:
      - main
    paths:
      - "mapsync-mod/**/*"

jobs:
  build:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v6"

      - name: "Set up JDK 25"
        uses: "actions/setup-java@v5"
        with:
          java-version: "25"
          distribution: "temurin"

      - name: "Compile mod"
        run: "./gradlew build"
        working-directory: "./mapsync-mod"

      - name: "Upload Build"
        uses: "actions/upload-artifact@v7"
        with:
          name: "Fabric"
          path: "mapsync-mod/dist/*.jar"
