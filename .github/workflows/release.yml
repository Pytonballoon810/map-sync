name: "Release"

# Fires only on tags shaped `v*` (e.g. v2.2.0, v2.2.0-rc1). Branch pushes
# go through build-mod.yml — keeping CI and release as separate workflows
# avoids the path-filter interaction that would otherwise skip the release
# whenever a tag points at a commit that didn't touch mapsync-mod/.
on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: "ubuntu-latest"
    # GITHUB_TOKEN defaults to read-only on tag events; releases need write.
    permissions:
      contents: "write"
    steps:
      - uses: "actions/checkout@v6"

      - name: "Set up JDK 25"
        uses: "actions/setup-java@v5"
        with:
          java-version: "25"
          distribution: "temurin"

      - name: "Build mod"
        run: "./gradlew build"
        working-directory: "./mapsync-mod"

      - name: "Create GitHub Release"
        uses: "softprops/action-gh-release@v2"
        with:
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            mapsync-mod/dist/*.jar
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
